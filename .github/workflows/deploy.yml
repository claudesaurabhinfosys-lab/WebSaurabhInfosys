name: Build & Package saurabhinfosys.com
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate contact.php
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 -c "
          import os
          with open('scripts/contact.php.template') as f:
              content = f.read()
          content = content.replace('GMAIL_APP_PASSWORD_PLACEHOLDER', os.environ['GMAIL_APP_PASSWORD'])
          with open('out/contact.php', 'w') as f:
              f.write(content)
          "

      - name: Generate portfolio API for Apache
        run: |
          python3 -c "
          import os, shutil
          os.makedirs('out/api/portfolio', exist_ok=True)
          shutil.copyfile('scripts/portfolio.php.template', 'out/api/portfolio.php')
          shutil.copyfile('scripts/portfolio.php.template', 'out/api/portfolio/index.php')
          if os.path.exists('public/api/portfolio.json'):
              shutil.copyfile('public/api/portfolio.json', 'out/api/portfolio.json')
              shutil.copyfile('public/api/portfolio.json', 'out/api/portfolio/portfolio.json')
          print('Portfolio API files generated in out/api')
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: out/
          retention-days: 7