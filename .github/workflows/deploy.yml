name: Build & Deploy to saurabhinfosys.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate contact.php
        run: |
          cp scripts/contact.php.template out/contact.php
          sed -i "s/GMAIL_APP_PASSWORD_PLACEHOLDER/${{ secrets.GMAIL_APP_PASSWORD }}/" out/contact.php

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ""
          private-key: ${{ secrets.SSH_KEY }}
          protocol: sftp
          port: 22
          local-dir: ./out/
          server-dir: /home/saurabhinfosys.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .htaccess
            extract.php
            phptest.php
            deploy-webhook.php
            4e472060b5dd251fff9f2f80eefa8bdb.txt
