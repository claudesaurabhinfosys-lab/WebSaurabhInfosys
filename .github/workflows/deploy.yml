name: Build & Deploy to saurabhinfosys.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate contact.php
        run: |
          cp scripts/contact.php.template out/contact.php
          sed -i "s/GMAIL_APP_PASSWORD_PLACEHOLDER/${{ secrets.GMAIL_APP_PASSWORD }}/" out/contact.php

      - name: Zip build output
        run: zip -r build.zip out/

      - name: Upload zip and trigger webhook
        run: |
          TAG="deploy-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" build.zip \
            --repo ${{ github.repository }} \
            --title "Deploy $TAG" \
            --notes "Automated deploy" \
            --latest
          ZIP_URL=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets --jq '.assets[0].url')
          PAYLOAD="{\"action\":\"deploy\",\"client_payload\":{\"zip_url\":\"${ZIP_URL}\",\"token\":\"${{ secrets.GITHUB_TOKEN }}\"}}"
          SIG="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | cut -d' ' -f2)"
          curl -s -X POST "https://saurabhinfosys.com/deploy-webhook.php" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
