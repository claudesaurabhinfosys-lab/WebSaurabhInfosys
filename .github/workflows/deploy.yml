name: Build & Deploy to saurabhinfosys.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package output
        run: |
          cd out
          zip -r ../deploy.zip . -x "*.htaccess" -x "extract.php" -x "phptest.php" -x "deploy-webhook.php" -x "4e472060b5dd251fff9f2f80eefa8bdb.txt"
          cd ..
          echo "Package size: $(du -sh deploy.zip)"

      - name: Deploy via webhook
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -F "secret=${{ secrets.WEBHOOK_SECRET }}" \
            -F "deploy_path=${{ secrets.DEPLOY_PATH }}" \
            -F "file=@deploy.zip" \
            https://saurabhinfosys.com/deploy-webhook.php)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
